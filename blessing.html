<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>祝黄鑫雪 · 爱心祝福</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    background: #0d0a14;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== 背景层 ===== */
  .bg-layer {
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,107,138,0.12) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 50%, rgba(200,80,120,0.10) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 80%, rgba(255,130,160,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 35%, #1a1025 0%, #0d0a14 100%);
  }

  /* ===== 飘浮背景爱心 ===== */
  .bg-hearts {
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .bg-heart {
    position:fixed;
    font-size:1.5rem;
    opacity:0.08;
    animation: bgFloat linear infinite;
  }
  @keyframes bgFloat {
    0%   { transform:translateY(0) rotate(0deg) scale(1); opacity:0.06; }
    25%  { opacity:0.12; }
    50%  { transform:translateY(-70vh) rotate(180deg) scale(0.7); opacity:0.04; }
    75%  { opacity:0.10; }
    100% { transform:translateY(-105vh) rotate(360deg) scale(1.1); opacity:0; }
  }

  /* ===== 开始页 ===== */
  .start-screen {
    position:fixed; inset:0; z-index:200;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .start-screen.gone {
    opacity:0; pointer-events:none;
    transform: scale(1.06);
  }

  .start-icon {
    font-size:4rem; margin-bottom:0.5rem;
    animation: heartBeat 1.2s ease-in-out infinite;
  }
  @keyframes heartBeat {
    0%,100% { transform:scale(1); }
    15%     { transform:scale(1.18); }
    30%     { transform:scale(1); }
    45%     { transform:scale(1.14); }
    60%     { transform:scale(1); }
  }

  .start-title {
    font-size:1.6rem; font-weight:700;
    background: linear-gradient(135deg, #ff9aaf, #ff5678, #f06292);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing:0.12em;
    margin-bottom:0.3rem;
  }

  .start-sub {
    font-size:0.82rem; color:rgba(255,255,255,0.35);
    letter-spacing:0.14em;
    margin-bottom:3rem;
  }

  .start-btn {
    width:190px; height:50px;
    border:none; border-radius:25px;
    background: linear-gradient(135deg, #ff6b8a, #e83e5b);
    color:#fff; font-size:1.08rem; font-weight:600;
    letter-spacing:0.12em;
    box-shadow: 0 6px 28px rgba(232,62,91,0.45);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .start-btn::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }
  .start-btn:hover::after {
    transform: translateX(100%);
  }
  .start-btn:active {
    transform:scale(0.94);
    box-shadow: 0 3px 16px rgba(232,62,91,0.6);
  }

  .start-hint {
    margin-top:1.5rem; font-size:0.7rem;
    color:rgba(255,255,255,0.22);
    letter-spacing:0.1em;
  }

  /* 统计文字 */
  .counter-text {
    position:fixed; top:18px; right:18px; z-index:180;
    font-size:0.7rem; color:rgba(255,255,255,0.28);
    letter-spacing:0.06em;
    opacity:0; transition: opacity 1s ease;
  }
  .counter-text.show { opacity:1; }

  /* ===== 爱心弹窗 ===== */
  .heart-popup {
    position:fixed;
    user-select:none;
    -webkit-user-select:none;
    pointer-events:none;
    animation: heartPopIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .heart-popup.fading {
    animation: heartPopOut 0.4s ease-in both;
  }

  @keyframes heartPopIn {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(0deg); opacity:0; }
    60%  { transform: translate(-50%,-50%) scale(1.08) rotate(var(--r)); opacity:1; }
    100% { transform: translate(-50%,-50%) scale(1) rotate(var(--r)); opacity:1; }
  }
  @keyframes heartPopOut {
    0%   { transform: translate(-50%,-50%) scale(1) rotate(var(--r)); opacity:1; }
    100% { transform: translate(-50%,-50%) scale(0.25) rotate(var(--r)); opacity:0; }
  }

  .heart-popup svg {
    display:block;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,0.35));
  }
  .heart-popup svg .heart-fill {
    transition: fill 0.3s;
  }

  /* foreignObject 内的文字容器 */
  .heart-text-wrap {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:5px 8px;
  }
  .heart-text-wrap span {
    color:#fff;
    font-weight:600;
    font-size:0.76rem;
    letter-spacing:0.05em;
    line-height:1.35;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  /* 小爱心：用纯CSS，不用foreignObject，兼容性更好 */
  .heart-popup.small-heart .heart-text-wrap span {
    font-size:0.68rem;
  }
</style>
</head>

      audio.load();
    } catch(e) {
      console.log('🎵 音频初始化失败:', e.message);
    }
    return audio;
  }

  function startMusic() {
    if (musicOn) return;
    const a = initAudio();
    if (!a) return;
    a.playbackRate = 1.0;
    a.play().then(() => {
      musicOn = true;
      console.log('🎵 BGM 开始播放');
    }).catch((e) => {
      console.log('🎵 BGM 播放失败:', e.message);
      a.load();
      setTimeout(() => {
        a.play().then(() => { musicOn = true; }).catch(() => {});
      }, 400);
    });
  }

  document.addEventListener('WeixinJSBridgeReady', () => {
    if (audio) audio.load();
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && musicOn && audio) audio.play().catch(() => {});
  });

  let svgIdCounter = 0;

  // ===== 生成爱心 SVG =====
  function createHeartSVG(color, scale) {
    const s = scale || 1;
    const uid = svgIdCounter++;
    const dark = darkenColor(color);
    // 内联样式规避 filter/gradient ID 冲突
    return `
      <svg width="${Math.round(120 * s)}" height="${Math.round(110 * s)}" viewBox="0 0 100 93" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="g${uid}">
            <feGaussianBlur stdDeviation="0.8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <linearGradient id="gr${uid}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${color}" stop-opacity="1"/>
            <stop offset="100%" stop-color="${dark}" stop-opacity="1"/>
          </linearGradient>
        </defs>
        <path
          d="M50,88 C20,72 0,54 0,34 C0,16 14,2 28,5 C37,8 46,16 50,22 C54,16 63,8 72,5 C86,2 100,16 100,34 C100,54 80,72 50,88Z"
          fill="url(#gr${uid})"
          stroke="rgba(255,255,255,0.22)" stroke-width="0.8"
          filter="url(#g${uid})"
        />
        <foreignObject x="8" y="24" width="84" height="52">
          <div xmlns="http://www.w3.org/1999/xhtml" class="heart-text-wrap">
            <span>TEXT_PLACEHOLDER</span>
          </div>
        </foreignObject>
      </svg>`;
  }

  function darkenColor(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    const dr = Math.max(0, r - 40);
    const dg = Math.max(0, g - 55);
    const db = Math.max(0, b - 45);
    return '#' + [dr,dg,db].map(v => v.toString(16).padStart(2,'0')).join('');
  }

  // ===== 随机位置 =====
  function randomPos(scale) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = scale || 1;
    const cardW = 120 * s;
    const cardH = 110 * s;
    const halfW = cardW / 2;
    const halfH = cardH / 2;
    // 安全边距
    const pad = 8;
    const minX = halfW + pad;
    const maxX = vw - halfW - pad;
    const minY = halfH + pad;
    const maxY = vh - halfH - pad;
    return {
      x: minX + Math.random() * Math.max(0, maxX - minX),
      y: minY + Math.random() * Math.max(0, maxY - minY),
    };
  }

  // ===== 弹窗 =====
  function spawnHeart() {
    if (!running) return;

    // 检查可见数量，超过上限移除最旧的
    const existing = document.querySelectorAll('.heart-popup');
    if (existing.length >= MAX_VISIBLE) {
      const old = existing[0];
      old.classList.add('fading');
      setTimeout(() => { if (old.parentNode) old.remove(); }, 420);
    }

    const text = BLESSINGS[blessingIndex % TOTAL];
    blessingIndex++;
    if (blessingIndex >= TOTAL) {
      // 循环
      blessingIndex = 0;
    }

    const color = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
    const scale = 0.95 + Math.random() * 0.65; // 0.95 ~ 1.6
    const rot = (Math.random() - 0.5) * 28;   // -14° ~ +14°
    const pos = randomPos(scale);

    const svgStr = createHeartSVG(color, scale).replace('TEXT_PLACEHOLDER', escapeHTML(text));

    const card = document.createElement('div');
    card.className = 'heart-popup';
    if (scale < 0.85) card.classList.add('small-heart');
    card.style.cssText = `
      left:${pos.x}px; top:${pos.y}px;
      --r:${rot.toFixed(1)}deg;
      z-index:${10 + spawnedCount};
    `;
    card.innerHTML = svgStr;
    document.body.appendChild(card);
    spawnedCount++;

    // 更新计数
    updateCounter();

    // 设定存活时间
    const life = HEART_LIFE_MIN + Math.random() * (HEART_LIFE_MAX - HEART_LIFE_MIN);
    const timer = setTimeout(() => {
      card.classList.add('fading');
      setTimeout(() => {
        if (card.parentNode) card.remove();
        updateCounter();
      }, 420);
    }, life);
    card._lifeTimer = timer;
  }

  function updateCounter() {
    const el = document.getElementById('counter');
    const count = document.querySelectorAll('.heart-popup').length;
    el.textContent = count + ' / ' + TOTAL;
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== 调度 =====
  function scheduleNext() {
    if (!running) return;
    spawnTimer = setTimeout(() => {
      spawnHeart();
      scheduleNext();
    }, SPAWN_IVAL + Math.random() * 350); // 加一点随机，更自然
  }

  // ===== 开始按钮 =====
  document.getElementById('startBtn').addEventListener('click', function() {
    startMusic();
    document.getElementById('startScreen').classList.add('gone');
    document.getElementById('counter').classList.add('show');
    running = true;

    // 首颗爱心
    spawnHeart();
    // 前10颗加速出现，快速建立氛围
    let quickCount = 0;
    function quickSpawn() {
      if (quickCount >= 9 || !running) return;
      quickCount++;
      setTimeout(() => {
        spawnHeart();
        if (quickCount < 9) quickSpawn();
      }, 220 + Math.random() * 280);
    }
    quickSpawn();

    scheduleNext();
  });

  // ===== 页面可见性 =====
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      running = false;
      clearTimeout(spawnTimer);
    } else if (musicOn) {
      running = true;
      scheduleNext();
    }
  });

  // ===== 窗口大小改变 =====
  let resizeDebounce = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(() => {
      // 位置已经固定，不做额外处理
    }, 500);
  });

  console.log('💝 黄鑫雪的爱心祝福 — 100条祝福准备就绪');
  console.log('   💗 点击"打开礼物"开始');
})();
</script>
