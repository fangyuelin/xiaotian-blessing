<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>田姐的祝福</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    background: #08080f;
    user-select: none;
    -webkit-user-select: none;
  }

  .bg-layer {
    position:fixed; inset:0; z-index:0;
    background: radial-gradient(ellipse at 50% 38%, #1e1e40 0%, #0a0a18 100%);
  }

  /* ===== 开始页 ===== */
  .start-screen {
    position:fixed; inset:0; z-index:200;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .start-screen.gone {
    opacity:0; pointer-events:none;
    transform: scale(1.06);
  }

  .start-icon {
    font-size:3.6rem; margin-bottom:0.5rem;
    animation: iconFloat 2.4s ease-in-out infinite;
  }
  @keyframes iconFloat {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-14px); }
  }

  .start-title {
    font-size:1.5rem; font-weight:700;
    background: linear-gradient(135deg, #f0d6b8, #d4a574, #c9976b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing:0.14em;
    margin-bottom:0.3rem;
  }

  .start-sub {
    font-size:0.82rem; color:rgba(255,255,255,0.38);
    letter-spacing:0.16em;
    margin-bottom:3rem;
  }

  .start-btn {
    width:180px; height:48px;
    border:none; border-radius:24px;
    background: linear-gradient(135deg, #d4a574, #b87d5a);
    color:#fff; font-size:1.05rem; font-weight:600;
    letter-spacing:0.12em;
    box-shadow: 0 6px 26px rgba(180,120,70,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor:pointer;
  }
  .start-btn:active {
    transform:scale(0.94);
    box-shadow: 0 3px 14px rgba(180,120,70,0.55);
  }

  .start-hint {
    margin-top:1.4rem; font-size:0.7rem;
    color:rgba(255,255,255,0.25);
    letter-spacing:0.1em;
  }

  /* ===== 弹窗卡片 ===== */
  .photo-popup {
    position:fixed;
    width:30vw;
    max-width:150px;
    min-width:85px;
    border-radius:10px;
    overflow:hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    pointer-events:none;
  }
  .photo-popup.fading {
    animation: popOut 0.35s ease-in both;
  }
  @keyframes popIn {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(0deg); opacity:0; }
    100% { transform: translate(-50%,-50%) scale(1) rotate(var(--r)); opacity:1; }
  }
  @keyframes popOut {
    0%   { transform: translate(-50%,-50%) scale(1) rotate(var(--r)); opacity:1; }
    100% { transform: translate(-50%,-50%) scale(0.3) rotate(var(--r)); opacity:0; }
  }

  .photo-popup img {
    width:100%; display:block;
    aspect-ratio:3/4;
    object-fit:cover;
  }
  .photo-popup .label {
    position:absolute; bottom:0; left:0; right:0;
    padding:0.9rem 0.4rem 0.55rem;
    background: linear-gradient(transparent, rgba(0,0,0,0.65) 25%, rgba(0,0,0,0.88));
    color:#fff; font-size:0.68rem; font-weight:600;
    text-align:center; letter-spacing:0.04em;
    line-height:1.3;
  }
</style>
</head>
<body>

<div class="bg-layer"></div>

<div class="start-screen" id="startScreen">
  <div class="start-icon">🎁</div>
  <h1 class="start-title">田姐的祝福</h1>
  <p class="start-sub">一份特别的礼物，请查收</p>
  <button class="start-btn" id="startBtn">✨ 点击开启 ✨</button>
  <p class="start-hint">戴上耳机，效果更佳 🎧</p>
</div>

      audio.loop = true;
      audio.volume = 0.8;
      audio.preload = 'auto';
      audio.crossOrigin = 'anonymous';
      audio.addEventListener('error', (e) => {
        console.log('🎵 音频加载错误:', audio.error?.code, audio.error?.message);
      });
      audio.addEventListener('canplaythrough', () => {
        console.log('🎵 音频缓冲完成，可以播放');
      });
      audio.load();
    } catch(e) {
      console.log('🎵 音频初始化失败:', e.message);
      audio = null;
    }
    return audio;
  }

  function startMusic() {
    if (musicOn) return;
    const a = initAudio();
    if (!a) return;
    a.playbackRate = 1.25;
    a.play().then(() => {
      musicOn = true;
      console.log('🎵 BGM 开始播放');
    }).catch((e) => {
      console.log('🎵 BGM 播放失败:', e.message);
      // 有些浏览器需要重新加载
      a.load();
      setTimeout(() => {
        a.play().then(() => { musicOn = true; }).catch(() => {});
      }, 300);
    });
  }

  document.addEventListener('WeixinJSBridgeReady', () => { if (audio) audio.load(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && musicOn && audio) audio.play().catch(() => {});
  });

  // ===== 预加载 =====
  PHOTOS.forEach(src => { const im = new Image(); im.src = src; });

  // ===== 随机位置（全屏均匀分布） =====
  function randomPos() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const halfW = vw * 0.15;       // 30vw / 2
    const halfH = halfW * (4/3);   // 卡片高 = 宽 × 4/3
    const minX = halfW + 2;
    const maxX = vw - halfW - 2;
    const minY = halfH + 2;
    const maxY = vh - halfH - 2;
    return {
      x: minX + Math.random() * Math.max(0, maxX - minX),
      y: minY + Math.random() * Math.max(0, maxY - minY)
    };
  }

  // ===== 弹窗 =====
  function spawnPopup() {
    if (!running) return;

    const existing = document.querySelectorAll('.photo-popup');
    if (existing.length >= MAX_VISIBLE) {
      const old = existing[0];
      old.classList.add('fading');
      setTimeout(() => { if (old.parentNode) old.remove(); }, 360);
    }

    const pos = randomPos();
    const idx = Math.floor(Math.random() * TOTAL);
    const rot = (Math.random() - 0.5) * 16;

    const card = document.createElement('div');
    card.classList.add('photo-popup');
    card.style.cssText = `
      left:${pos.x}px; top:${pos.y}px;
      --r:${rot.toFixed(1)}deg;
      z-index:${spawnedCount};
    `;
    card.innerHTML = `
      <img src="${PHOTOS[idx]}" alt="" />
      <div class="label">${BLESSINGS[idx]}</div>
    `;
    document.body.appendChild(card);
    spawnedCount++;

    const life = 5500 + Math.random() * 7500;
    const t = setTimeout(() => {
      card.classList.add('fading');
      setTimeout(() => { if (card.parentNode) card.remove(); }, 360);
    }, life);
    card._lifeTimer = t;
  }

  // ===== 速度调度 =====
  function scheduleNext() {
    if (!running) return;
    spawnTimer = setTimeout(() => {
      spawnPopup();
      scheduleNext();
    }, SPAWN_IVAL);
  }

  // ===== 开启 =====
  document.getElementById('startBtn').addEventListener('click', function() {
    startMusic();
    document.getElementById('startScreen').classList.add('gone');
    running = true;
    spawnPopup();
    scheduleNext();
  });

  // 切后台
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { running = false; clearTimeout(spawnTimer); }
    else if (musicOn) { running = true; scheduleNext(); }
  });

  console.log('🎐 田姐的祝福 — 点击"✨ 点击开启 ✨"开始');
})();
</script>
